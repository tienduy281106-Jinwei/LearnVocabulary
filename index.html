<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - Bảng Điều Khiển</title>
  <meta name="description"
    content="Trang web học từ vựng tiếng Anh hiện đại: Quản lý từ vựng cá nhân, ôn tập Flashcard 3D, kiểm tra trắc nghiệm, học ngữ pháp và luyện đặt câu thông minh.">

  <!-- Google Fonts: Be Vietnam Pro + Inter + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="app-container">

    <!-- SIDEBAR NAVIGATION -->
    <div id="sidebar-mount"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- APP HEADER -->
      <header class="app-header">
        <!-- ROBOT DOG MASCOT + TYPEWRITER SPEECH BUBBLE -->
        <div class="robot-mascot-section">
          <div class="robot-dog-wrap">

            <!-- CSS Robot Dog -->
            <div class="robot-dog">
              <!-- Antenna -->
              <div class="robot-antenna">
                <div class="robot-antenna-ball"></div>
                <div class="robot-antenna-pole"></div>
              </div>
              <!-- Head -->
              <div class="robot-head">
                <div class="robot-ear robot-ear--l"></div>
                <div class="robot-ear robot-ear--r"></div>
                <div class="robot-eyes">
                  <div class="robot-eye">
                    <div class="robot-pupil"></div>
                  </div>
                  <div class="robot-eye">
                    <div class="robot-pupil"></div>
                  </div>
                </div>
                <div class="robot-mouth-zone">
                  <div class="robot-nose-btn"></div>
                  <div class="robot-smile-bar"></div>
                </div>
              </div>
              <!-- Body -->
              <div class="robot-body">
                <div class="robot-leds">
                  <div class="robot-led rl1"></div>
                  <div class="robot-led rl2"></div>
                  <div class="robot-led rl3"></div>
                </div>
              </div>
              <!-- Legs -->
              <div class="robot-feet">
                <div class="robot-foot"></div>
                <div class="robot-foot"></div>
                <div class="robot-foot"></div>
                <div class="robot-foot"></div>
              </div>
              <!-- Tail -->
              <div class="robot-tail-wrap">
                <div class="robot-tail"></div>
              </div>
            </div>

            <!-- Speech Bubble -->
            <div class="robot-bubble">
              <span id="robot-typewriter"></span><span class="robot-cursor">|</span>
            </div>

          </div>
          <p id="current-date-txt" class="robot-date-txt"></p>
        </div>

        <div class="stats-summary-header">
          <div class="stat-header-item">
            <i class="fa-solid fa-database"></i>
            <div>
              <span class="stat-header-value" id="header-total-vocab">0</span>
              <span class="stat-header-label">Đã lưu</span>
            </div>
          </div>
          <div class="stat-header-item">
            <i class="fa-solid fa-circle-check" style="color: var(--color-success);"></i>
            <div>
              <span class="stat-header-value" id="header-mastered-vocab">0</span>
              <span class="stat-header-label">Đã thuộc</span>
            </div>
          </div>
        </div>
      </header>

      <!-- ---------------------------------------------------- -->
      <!-- SECTION: DASHBOARD                                     -->
      <!-- ---------------------------------------------------- -->
      <section class="page-section active" id="sec-dashboard">
        <!-- Stats Widgets -->
        <div class="widget-stats">
          <div class="stat-card vocab">
            <div class="stat-icon"><i class="fa-solid fa-book"></i></div>
            <div class="stat-num" id="dash-stat-vocab">0</div>
            <div class="stat-name">Từ vựng đã nhập</div>
          </div>
          <div class="stat-card mastered">
            <div class="stat-icon"><i class="fa-solid fa-brain"></i></div>
            <div class="stat-num" id="dash-stat-mastered">0</div>
            <div class="stat-name">Từ vựng đã ghi nhớ</div>
          </div>
          <div class="stat-card sentences">
            <div class="stat-icon"><i class="fa-solid fa-quote-right"></i></div>
            <div class="stat-num" id="dash-stat-sentences">0</div>
            <div class="stat-name">Câu tiếng Anh đã đặt</div>
          </div>
        </div>

        <div class="dashboard-grid">
          <!-- Left Dashboard Panels -->
          <div style="display: flex; flex-direction: column; gap: 20px;">
            <!-- Motivation Quote Widget -->
            <div class="panel quote-panel">
              <i class="fa-solid fa-quote-left"></i>
              <p class="quote-content" id="quote-text">"The limits of my language mean the limits of my world."</p>
              <div class="quote-author" id="quote-author">— Ludwig Wittgenstein</div>
            </div>

            <!-- Quick Actions -->
            <div class="panel">
              <h3 class="panel-title"><i class="fa-solid fa-bolt"></i> Thao tác nhanh</h3>
              <div class="quick-start-grid">
                <a class="quick-btn add" href="vocabulary.html">
                  <i class="fa-solid fa-plus"></i>
                  <span>Thêm từ mới</span>
                </a>
                <a class="quick-btn flash" href="flashcards.html">
                  <i class="fa-solid fa-clone"></i>
                  <span>Luyện Flashcards</span>
                </a>
                <a class="quick-btn quiz" href="quiz.html">
                  <i class="fa-solid fa-circle-question"></i>
                  <span>Làm kiểm tra</span>
                </a>
                <a class="quick-btn sentence" href="sentences.html">
                  <i class="fa-solid fa-pen-nib"></i>
                  <span>Tập đặt câu</span>
                </a>
              </div>
            </div>
          </div>

          <!-- Right Dashboard Panel: Recent Added Words -->
          <div class="panel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fa-solid fa-clock-rotate-left"></i> Từ vựng thêm gần đây</h3>
              <a class="btn btn-secondary btn-sm" href="vocabulary.html">Xem tất cả</a>
            </div>
            <div class="recent-list" id="dashboard-recent-vocab">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container"
    style="position: fixed; bottom: 30px; right: 30px; z-index: 2000; display: flex; flex-direction: column; gap: 10px;">
  </div>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pdf_data.js"></script>
  <script src="js/seeder.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
